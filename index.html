<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Mensiversary 8</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="800" height="448"></canvas>

    <!-- Layar kemenangan: isinya diisi dari config.js -->
    <div id="win" class="hidden">
      <div class="card">
        <h1 id="win-title"></h1>
        <div id="win-body"></div>
        <p id="win-sign"></p>
        <button id="again">Main lagi</button>
      </div>
    </div>
  </div>

  <!-- Kontrol sentuh untuk HP -->
  <div id="touch">
    <div class="group">
      <button data-key="left">◀</button>
      <button data-key="right">▶</button>
    </div>
    <div class="group">
      <button data-key="run">LARI</button>
      <button data-key="jump">LOMPAT</button>
    </div>
  </div>

  <p id="hint">← → / A D: jalan &nbsp;|&nbsp; Spasi / W / ↑: lompat &nbsp;|&nbsp; Shift: lari</p>

  <script src="config.js"></script>
  <script src="input.js"></script>
  <script src="level.js"></script>
  <script src="player.js"></script>
  <script src="game.js"></script>
</body>
</html>
